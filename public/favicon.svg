<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0A96D" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1A1715" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="favCardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A332C" />
      <stop offset="100%" stop-color="#221D19" />
    </linearGradient>
    <linearGradient id="favCardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4036" />
      <stop offset="100%" stop-color="#2A241F" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D09D" />
      <stop offset="50%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#C97B34" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="36" height="36" rx="9" fill="#1A1715" />
  <circle cx="18" cy="18" r="14" fill="url(#favGlow)" />

  <!-- Back card -->
  <rect
    x="6"
    y="7"
    width="18"
    height="24"
    rx="4.5"
    transform="rotate(-12 15 19)"
    fill="url(#favCardGrad1)"
    stroke="#55473A"
    stroke-width="1.2"
  />

  <!-- Front card -->
  <rect
    x="12"
    y="6"
    width="18"
    height="24"
    rx="4.5"
    transform="rotate(10 21 18)"
    fill="url(#favCardGrad2)"
    stroke="url(#favGold)"
    stroke-width="1.3"
  />

  <!-- Center Gold Heart -->
  <path
    d="M21 13.5C21 13.5 17 10 14.5 12.5C12 15 13.5 19 21 23C28.5 19 30 15 27.5 12.5C25 10 21 13.5 21 13.5Z"
    fill="url(#favGold)"
    opacity="0.95"
  />
  <circle cx="21" cy="16" r="1.8" fill="#FAF3E0" />
</svg>